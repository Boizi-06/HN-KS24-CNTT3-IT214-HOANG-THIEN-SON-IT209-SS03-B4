# Server Block 1: Beta App (Testing Environment)
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /var/www/beta-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Custom error page (optional)
    error_page 404 /index.html;
}

# Server Block 2: Internal App (Internal Information Portal)
server {
    listen 8090;
    listen [::]:8090;

    server_name _;

    root /var/www/internal-app/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Custom error page (optional)
    error_page 404 /index.html;
}
