<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal App - Trang thông tin nội bộ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0fdf4;
            padding: 20px;
        }
        .card {
            background: rgba(6, 78, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            background: #059669;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            color: #a7f3d0;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .info-box {
            background: rgba(2, 44, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            text-align: left;
            font-size: 0.95rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #a7f3d0;
        }
        .value {
            font-weight: 600;
            color: #6ee7b7;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Port 8090</span>
        <h1>🏢 Internal App</h1>
        <p>Hệ thống thông tin nội bộ dành riêng cho đội ngũ kỹ thuật và quản trị viên hệ thống.</p>
        
        <div class="info-box">
            <div class="info-row">
                <span class="label">Dịch vụ:</span>
                <span class="value">Internal Information Portal</span>
            </div>
            <div class="info-row">
                <span class="label">Cổng lắng nghe:</span>
                <span class="value">8090 (TCP)</span>
            </div>
            <div class="info-row">
                <span class="label">Thư mục gốc (Root):</span>
                <span class="value">/var/www/internal-app/html/</span>
            </div>
            <div class="info-row">
                <span class="label">Trạng thái:</span>
                <span class="value" style="color: #4ade80;">Active / Running</span>
            </div>
        </div>
    </div>
</body>
</html>
